services:
  trading-dashboard:
    build: .
    container_name: trading-dashboard
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      TRADING_DASHBOARD_DB_PATH: /data/trading_dashboard.db
      TRADING_DASHBOARD_FEE_POLICY_PATH: ${TRADING_DASHBOARD_FEE_POLICY_PATH:-/app/config/fee-policies.json}
      TRADING_DASHBOARD_EXECUTION_HISTORY_DAYS: ${TRADING_DASHBOARD_EXECUTION_HISTORY_DAYS:-90}
      TRADING_DASHBOARD_SEED_DEMO: ${TRADING_DASHBOARD_SEED_DEMO:-false}
      TRADING_DASHBOARD_RETRY_MAX_ATTEMPTS: ${TRADING_DASHBOARD_RETRY_MAX_ATTEMPTS:-3}
      TRADING_DASHBOARD_RETRY_BACKOFF_SECONDS: ${TRADING_DASHBOARD_RETRY_BACKOFF_SECONDS:-0.25}
      TRADING_DASHBOARD_RETRY_MAX_BACKOFF_SECONDS: ${TRADING_DASHBOARD_RETRY_MAX_BACKOFF_SECONDS:-4}
      TRADING_DASHBOARD_API_MIN_INTERVAL_SECONDS: ${TRADING_DASHBOARD_API_MIN_INTERVAL_SECONDS:-0.05}
      TRADING_DASHBOARD_AUTH_ENABLED: ${TRADING_DASHBOARD_AUTH_ENABLED:-false}
      TRADING_DASHBOARD_VIEWER_PASSWORD_HASH: ${TRADING_DASHBOARD_VIEWER_PASSWORD_HASH:-}
      TRADING_DASHBOARD_OPERATOR_PASSWORD_HASH: ${TRADING_DASHBOARD_OPERATOR_PASSWORD_HASH:-}
      TRADING_DASHBOARD_SESSION_TTL_SECONDS: ${TRADING_DASHBOARD_SESSION_TTL_SECONDS:-28800}
      TRADING_DASHBOARD_COOKIE_SECURE: ${TRADING_DASHBOARD_COOKIE_SECURE:-false}
      TRADING_DASHBOARD_LOG_PATH: ${TRADING_DASHBOARD_LOG_PATH:-/data/trading_dashboard.log}
      TRADING_DASHBOARD_LOG_LEVEL: ${TRADING_DASHBOARD_LOG_LEVEL:-INFO}
      TRADING_DASHBOARD_BACKUP_DIR: ${TRADING_DASHBOARD_BACKUP_DIR:-/data/backups}
      TRADING_DASHBOARD_BACKUP_TIME: ${TRADING_DASHBOARD_BACKUP_TIME:-03:00}
      TRADING_DASHBOARD_BACKUP_RETENTION_DAYS: ${TRADING_DASHBOARD_BACKUP_RETENTION_DAYS:-7}
      UPBIT_ACCESS_KEY: ${UPBIT_ACCESS_KEY:-}
      UPBIT_SECRET_KEY: ${UPBIT_SECRET_KEY:-}
      UPBIT_KEY_EXPIRES_ON: ${UPBIT_KEY_EXPIRES_ON:-}
      KIS_IS_PAPER: ${KIS_IS_PAPER:-false}
      KIS_PENSION_APP_KEY: ${KIS_PENSION_APP_KEY:-}
      KIS_PENSION_APP_SECRET: ${KIS_PENSION_APP_SECRET:-}
      KIS_PENSION_ACCOUNT_NO: ${KIS_PENSION_ACCOUNT_NO:-}
      KIS_PENSION_ACCOUNT_PRODUCT_CODE: ${KIS_PENSION_ACCOUNT_PRODUCT_CODE:-}
      KIS_PENSION_KEY_EXPIRES_ON: ${KIS_PENSION_KEY_EXPIRES_ON:-}
      KIS_PENSION_LABEL: ${KIS_PENSION_LABEL:-연금저축}
      KIS_PENSION_CATEGORY: ${KIS_PENSION_CATEGORY:-연금}
      KIS_ISA_APP_KEY: ${KIS_ISA_APP_KEY:-}
      KIS_ISA_APP_SECRET: ${KIS_ISA_APP_SECRET:-}
      KIS_ISA_ACCOUNT_NO: ${KIS_ISA_ACCOUNT_NO:-}
      KIS_ISA_ACCOUNT_PRODUCT_CODE: ${KIS_ISA_ACCOUNT_PRODUCT_CODE:-}
      KIS_ISA_KEY_EXPIRES_ON: ${KIS_ISA_KEY_EXPIRES_ON:-}
      KIS_ISA_LABEL: ${KIS_ISA_LABEL:-ISA중개형}
      KIS_ISA_CATEGORY: ${KIS_ISA_CATEGORY:-주식(국내)}
      TOSSINVEST_CLIENT_ID: ${TOSSINVEST_CLIENT_ID:-}
      TOSSINVEST_CLIENT_SECRET: ${TOSSINVEST_CLIENT_SECRET:-}
      TOSSINVEST_BASE_URL: ${TOSSINVEST_BASE_URL:-https://openapi.tossinvest.com}
      TOSSINVEST_ACCOUNT_SEQ: ${TOSSINVEST_ACCOUNT_SEQ:-}
      TOSSINVEST_KEY_EXPIRES_ON: ${TOSSINVEST_KEY_EXPIRES_ON:-}
      TOSSINVEST_ACCOUNT_LABEL: ${TOSSINVEST_ACCOUNT_LABEL:-토스증권}
      TOSSINVEST_ACCOUNT_CATEGORY: ${TOSSINVEST_ACCOUNT_CATEGORY:-주식(해외/국내)}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    profiles: ["secure"]
    image: caddy:2-alpine
    container_name: trading-dashboard-caddy
    restart: unless-stopped
    depends_on:
      trading-dashboard:
        condition: service_healthy
    environment:
      TRADING_DASHBOARD_DOMAIN: ${TRADING_DASHBOARD_DOMAIN:-localhost}
    ports:
      - "${TRADING_DASHBOARD_HTTP_PORT:-80}:80"
      - "${TRADING_DASHBOARD_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-data:/data
      - ./deploy/caddy-config:/config
